<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Alert App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>US National Weather Service Alerts</h1>

    <form id="alert-form">
      <label for="state">Enter State Abbreviation:</label>
      <input 
        type="text" 
        id="state" 
        name="state" 
        placeholder="Enter state abbreviation" 
        required 
      />
      <button type="submit" id="get-alerts-btn">Get Weather Alerts</button>
    </form>

    <!-- Section for Alerts Display (matches test suite expectation) -->
    <div id="alerts-display"></div>

    <!-- Section for Error Messages -->
    <div id="error-message" class="hidden"></div>
  </main>

  <script src="index.js"></script>
</body>
</html>
